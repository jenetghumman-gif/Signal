<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Intelligence Engine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f9f7;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
    }

    header { margin-bottom: 2rem; }
    header h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    header p { font-size: 14px; color: #666; }

    .card {
      background: #fff;
      border: 1px solid #e8e8e5;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      font-size: 13px;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      line-height: 1.6;
      font-family: inherit;
      background: #fafafa;
      color: #1a1a1a;
      display: block;
    }
    textarea:focus { outline: none; border-color: #aaa; background: #fff; }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .controls-left { display: flex; gap: 10px; align-items: center; }

    select {
      font-size: 13px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-analyze {
      font-size: 13px;
      font-weight: 500;
      padding: 8px 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-analyze:hover { background: #333; }
    .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }

    .sample-link {
      font-size: 12px;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      font-family: inherit;
    }
    .sample-link:hover { color: #444; }

    .loading {
      display: none;
      gap: 6px;
      align-items: center;
      font-size: 13px;
      color: #888;
      padding: 0.75rem 0;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #bbb;
      animation: pulse 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }

    .err { font-size: 13px; color: #c0392b; padding: 6px 0; display: none; }

    #resultsEl { display: none; }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 10px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 1.25rem;
    }

    .metric {
      background: #f7f7f5;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .metric .lbl {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .metric .val { font-size: 22px; font-weight: 500; }
    .metric .sub { font-size: 12px; margin-top: 2px; color: #888; }

    .result-card {
      background: #fff;
      border: 1px solid #e8e8e5;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 1rem;
    }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; padding: 4px 11px; border-radius: 20px; }
    .tpos { background: #eaf3de; color: #2d5a0e; }
    .tneg { background: #fceaea; color: #7a1f1f; }
    .tneu { background: #f1f1ee; color: #555; }

    .body-text { font-size: 13px; line-height: 1.75; color: #333; }
    .draft-text { font-size: 13px; line-height: 1.75; color: #333; white-space: pre-wrap; }

    hr { border: none; border-top: 1px solid #eee; margin: 1.5rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PR intelligence engine</h1>
      <p>Paste a news article or brand mention — get sentiment analysis, risk scoring, and a drafted response</p>
    </header>

    <div class="card">
      <textarea id="txt" placeholder="Paste a news article, tweet, review, or press mention here..."></textarea>

      <div class="controls">
        <div class="controls-left">
          <select id="industry">
            <option value="a brand">Select industry</option>
            <option value="a technology company">Technology</option>
            <option value="a healthcare or pharmaceutical company">Healthcare / pharma</option>
            <option value="a financial services or banking institution">Financial services</option>
            <option value="a consumer goods or retail brand">Consumer goods / retail</option>
            <option value="an energy or utilities company">Energy / utilities</option>
            <option value="a food and beverage brand">Food & beverage</option>
            <option value="a media or entertainment company">Media / entertainment</option>
            <option value="a government or public sector organization">Government / public sector</option>
            <option value="a nonprofit or NGO">Nonprofit / NGO</option>
          </select>
          <button class="btn-analyze" id="runBtn">Analyze</button>
        </div>
        <button class="sample-link" id="sampleBtn">Load sample article</button>
      </div>

      <div id="errEl" class="err"></div>
      <div id="loadEl" class="loading">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <span>Analyzing...</span>
      </div>
    </div>

    <div id="resultsEl">
      <div class="section-label">Sentiment & risk</div>
      <div class="metric-row">
        <div class="metric">
          <div class="lbl">Overall sentiment</div>
          <div class="val" id="mSent"></div>
          <div class="sub" id="mSentSub"></div>
        </div>
        <div class="metric">
          <div class="lbl">Reputation risk</div>
          <div class="val" id="mRisk"></div>
          <div class="sub" id="mRiskSub"></div>
        </div>
        <div class="metric">
          <div class="lbl">Urgency</div>
          <div class="val" id="mUrg"></div>
          <div class="sub" id="mUrgSub"></div>
        </div>
      </div>

      <div class="section-label">Key signals</div>
      <div class="result-card"><div class="tag-row" id="tagRow"></div></div>

      <div class="section-label">Summary</div>
      <div class="result-card"><p id="sumText" class="body-text"></p></div>

      <div class="section-label">Drafted comms response</div>
      <div class="result-card"><p id="draftText" class="draft-text"></p></div>
    </div>
  </div>

  <script>
    // Point this to wherever your FastAPI server is running
    const API_BASE = 'http://localhost:8000';

    const SAMPLE = `A whistleblower has come forward with documents suggesting that TechVision Corp knowingly shipped faulty battery components in its popular SmartHome Hub devices, despite internal reports flagging safety risks six months ago. The leak, obtained by Reuters, includes internal emails in which senior engineers warned management about potential overheating issues that could pose fire hazards. Three house fires in California and Texas have been linked to the device, though TechVision Corp has not yet confirmed or denied the reports. Consumer advocacy groups are calling for an immediate recall. Shares fell 8% in pre-market trading following the news.`;

    document.getElementById('sampleBtn').addEventListener('click', function () {
      document.getElementById('txt').value = SAMPLE;
      document.getElementById('industry').value = 'a technology company';
    });

    document.getElementById('runBtn').addEventListener('click', runAnalysis);

    async function runAnalysis() {
      var text = document.getElementById('txt').value.trim();
      if (!text) { showErr('Please paste some text to analyze.'); return; }
      var industry = document.getElementById('industry').value;

      setLoading(true);
      hideErr();
      document.getElementById('resultsEl').style.display = 'none';

      try {
        var res = await fetch(API_BASE + '/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, industry: industry })
        });

        if (!res.ok) {
          var errData = await res.json().catch(function () { return {}; });
          throw new Error(errData.detail || 'Server error ' + res.status);
        }

        var d = await res.json();
        renderResults(d);
      } catch (e) {
        showErr('Analysis failed: ' + e.message);
      } finally {
        setLoading(false);
      }
    }

    function renderResults(d) {
      var sentColor = d.sentimentScore > 20 ? '#1D9E75' : d.sentimentScore < -20 ? '#c0392b' : '#d68910';
      var sentEl = document.getElementById('mSent');
      sentEl.textContent = d.sentiment;
      sentEl.style.color = sentColor;
      document.getElementById('mSentSub').textContent = 'Score: ' + (d.sentimentScore > 0 ? '+' : '') + Math.round(d.sentimentScore);

      var risk = Math.round(d.reputationRisk);
      var riskEl = document.getElementById('mRisk');
      riskEl.textContent = risk + '/10';
      riskEl.style.color = risk >= 7 ? '#c0392b' : risk >= 4 ? '#d68910' : '#1D9E75';
      document.getElementById('mRiskSub').textContent = risk >= 7 ? 'High exposure' : risk >= 4 ? 'Moderate' : 'Low exposure';

      var urgColors = { Low: '#1D9E75', Medium: '#d68910', High: '#c0392b', Critical: '#8e1111' };
      var urgEl = document.getElementById('mUrg');
      urgEl.textContent = d.urgency;
      urgEl.style.color = urgColors[d.urgency] || 'inherit';
      document.getElementById('mUrgSub').textContent = d.urgencyReason;

      var tagRow = document.getElementById('tagRow');
      tagRow.innerHTML = '';
      (d.signals || []).forEach(function (s) {
        var t = document.createElement('span');
        t.className = 'tag ' + (s.type === 'positive' ? 'tpos' : s.type === 'negative' ? 'tneg' : 'tneu');
        t.textContent = s.label;
        tagRow.appendChild(t);
      });

      document.getElementById('sumText').textContent = d.summary;
      document.getElementById('draftText').textContent = d.draftResponse;
      document.getElementById('resultsEl').style.display = 'block';
    }

    function setLoading(on) {
      document.getElementById('loadEl').style.display = on ? 'flex' : 'none';
      document.getElementById('runBtn').disabled = on;
    }
    function showErr(msg) {
      var el = document.getElementById('errEl');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideErr() {
      document.getElementById('errEl').style.display = 'none';
    }
  </script>
</body>
</html>
